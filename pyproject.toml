[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-emergence"
version = "0.1.0"
description = "MCP server for Emergence Science bounty and verification platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["mcp", "emergence", "bounties", "science"]
authors = [
  { name = "Emergence Science", email = "dev@emergence.science" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "mcp>=1.0.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
mcp-server-emergence = "mcp_server_emergence.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_emergence"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # Allow long lines for JSON schema descriptions

[tool.mypy]
strict = true
exclude = ["tests/"]
